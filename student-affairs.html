<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شؤون الطلبة — إدراج صور الطالبات وطباعة البطاقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root{
    --pink:#E85A71; 
    --pink-dark:#8A1C30; 
    --rose:#F6C2C9;
    --red:#B8001F; 
    --green:#2A7B4C;
    --gold:#D4AF37; 
    --cream:#FAF3F0; 
    --ink:#2C2C2C; 
    --line:#E5C7D0;
    --navy:#0D2C54;
    --present:#E2F3E4; --present-ink:#1E5631;
    --absent:#FADBD8; --absent-ink:#7A1F2B;
    --late:#FCF3CF; --late-ink:#8A5A00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
  body{ font-family:'Tajawal', sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

  #publicPassScreen {
    display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; background: #FAF3F0;
  }
  .pass-card {
    background: #fff; border: 3px solid var(--pink-dark); border-radius: 20px; padding: 22px; width: 100%; max-width: 1000px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
  .pass-card h2 { color: var(--pink-dark); margin: 0 0 5px; font-size: 20px; }
  .pass-status { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin: 12px 0; font-size: 13.5px; }
  .status-active { background: #E2F3E4; color: #1E5631; border: 1px solid #2A7B4C; }
  .status-none { background: #FCF3CF; color: #8A5A00; border: 1px solid var(--gold); }
  
  .pass-filters { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; margin:4px 0 8px; font-size:13px; font-weight:700; color:#444; }
  .pass-filters input[type=date]{ font-family:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; }
  .pass-credit { margin-top:14px; padding-top:10px; border-top:2px double var(--rose); font-family:'Aref Ruqaa','Reem Kufi',serif; font-size:19px; font-weight:700; color:var(--pink-dark); }
  /* على الهاتف: كل تصريح يظهر كبطاقة صغيرة بدل الجدول */
  @media (max-width: 720px){
    .pass-card{ padding:16px 12px; }
    .pass-table{ min-width:0 !important; }
    .pass-table, .pass-table tbody, .pass-table tr, .pass-table td{ display:block; width:100%; }
    .pass-table thead{ display:none; }
    .pass-table tr{ margin:10px 0; border:1.5px solid var(--line); border-right:6px solid #2A7B4C; border-radius:14px; padding:8px 12px; background:#fff; text-align:right; box-shadow:0 2px 8px rgba(0,0,0,.07); }
    .pass-table tr.is-out{ border-right-color:#B8001F; background:#FFF8F8; }
    .pass-table tr.is-ended{ border-right-color:#999; background:#F6F6F6; opacity:.8; }
    .pass-table td{ display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:left; border-bottom:1px dashed #eee; padding:6px 0; font-size:13px; }
    .pass-table td:last-child{ border-bottom:none; }
    .pass-table td::before{ content:attr(data-label); font-weight:800; color:var(--pink-dark); font-size:12px; white-space:nowrap; }
    .pass-table td[data-label="م"]{ display:none; }
    .pass-table td.c-name{ font-size:16px; }
    .pass-table td.c-status{ justify-content:center; font-size:14px; font-weight:800; padding-top:8px; }
    .pass-table td.c-status::before{ display:none; }
  }
  .pass-live { color:#2A7B4C; font-size:12px; animation: livePulse 1.6s infinite; }
  .pass-live.off { color:#B8001F; animation:none; }
  @keyframes livePulse { 50% { opacity:.35; } }
  .pass-table td.out-now { color:#B8001F; font-weight:800; }
  .pass-table td.ended-now { color:#777; font-weight:800; }
  .pass-filters select{ font-family:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:8px; }
  .pass-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .pass-table td, .pass-table th { padding: 8px; border-bottom: 1px solid var(--line); text-align: center; font-size: 13px; }
  .pass-table th { background: var(--pink-dark); color: #fff; }

  #authScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:15px; background: linear-gradient(135deg, #FAF3F0 0%, #FCE4E8 100%); }
  .auth-card{ background:#fff; border-radius:22px; box-shadow:0 15px 35px rgba(138, 28, 48, 0.15); padding:28px 24px; width:100%; max-width:440px; text-align:center; border:2px solid var(--rose); }
  .auth-header-grid { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding-bottom:12px; border-bottom:2px double var(--rose); }
  .auth-side { width:41%; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .auth-side img { width:82px; height:82px; object-fit:contain; background:#fff; }
  .auth-side .org { font-family:'Reem Kufi','Tajawal',sans-serif; font-weight:700; font-size:12.5px; line-height:1.5; color:#0D2C54; text-wrap:balance; }
  .auth-side.school .org { color:var(--pink-dark); }
  .auth-card h2{ margin:4px 0 6px; color:var(--pink-dark); font-family:'Aref Ruqaa','Reem Kufi',serif; font-weight:700; font-size:27px; line-height:1.55; text-shadow:0 1px 0 #fff, 0 2px 6px rgba(232,90,113,.25); }
  .auth-card h2::after{ content:""; display:block; width:70px; height:3px; margin:6px auto 0; border-radius:3px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .auth-card p.sub{ margin:8px 0 6px; font-family:'Reem Kufi','Tajawal',sans-serif; font-size:14px; color:#555; font-weight:700; }
  .auth-card p.designer-tag{ margin:0 0 16px; font-family:'Aref Ruqaa', serif; font-size:17px; color:var(--pink); }
  .auth-card input, .auth-card select{ width:100%; font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; margin-bottom:9px; background:#fff; -webkit-appearance:none; }
  .auth-card button{ width:100%; font-family:inherit; font-size:15px; font-weight:800; background:var(--pink-dark); color:#fff; border:none; border-radius:10px; padding:11px; cursor:pointer; transition:background .2s; }
  .auth-card button:hover{ background:var(--pink); }

  #appScreen{ display:none; width:100%; }
  .app{ display:flex; min-height:100vh; width:100%; }
  .sidebar{ width:230px; flex-shrink:0; background:linear-gradient(180deg, #9E2A3B 0%, var(--pink-dark) 100%); color:#fff; padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:10; }
  .sidebar .brand{ text-align:center; margin-bottom:14px; }
  .sidebar .brand .badge img{ width:100%; height:100%; object-fit:contain; border-radius:50%; }
  .sidebar .brand .badge{ width:78px;height:78px;border-radius:50%; background:#fff; margin:0 auto 8px; display:flex;align-items:center;justify-content:center; font-size:22px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .sidebar .brand h1{ font-size:13.5px; font-weight:800; margin:0 0 3px; line-height:1.4; }
  .sidebar .brand p{ font-size:11px; color:#F9DCDA; margin:0; }
  .sidebar .designer-signature { font-family: 'Aref Ruqaa', serif; font-size: 16px; color: #FFD37A; margin-top: 4px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }

  .user-chip{ font-size:11px; color:#FFF0F2; text-align:center; background:rgba(255,255,255,.12); border-radius:8px; padding:6px 8px; margin:12px 0; }
  .user-chip a{ color:#FFD37A; cursor:pointer; text-decoration:underline; }
  .nav-label{ font-size:11px; color:#F4B6C2; margin:12px 0 6px; padding-right:4px; }
  .nav-item{ display:block; width:100%; text-align:right; background:transparent; border:1px solid transparent; color:#FFF0F2; font-family:inherit; font-size:13px; font-weight:500; padding:9px 12px; border-radius:9px; margin-bottom:5px; cursor:pointer; transition:background .15s; }
  .nav-item:hover{ background:rgba(255,255,255,.15); }
  .nav-item.active{ background:#fff; color:var(--pink-dark); font-weight:800; }
  .save-indicator{ margin-top:16px; font-size:11px; color:#FFD37A; text-align:center; min-height:16px; font-weight:bold; }

  .main{ flex:1; padding:16px 20px 50px; max-width:1450px; width:100%; min-width:0; }
  .page-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; border-bottom:3px solid var(--pink); padding-bottom:10px; margin-bottom:14px; }
  .page-header h2{ margin:0 0 4px; font-size:19px; font-weight:800; color:var(--pink-dark); }
  .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:end; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:10px; box-shadow:0 3px 10px rgba(232,90,113,.05); }
  .field{ display:flex; flex-direction:column; gap:3px; flex:1 1 125px; }
  .field label{ font-size:11px; font-weight:700; color:var(--pink-dark); }
  .field select, .field input[type=date], .field input[type=text]{ font-family:inherit; font-size:14px; padding:6px 8px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink); width:100%; -webkit-appearance:none; }
  .btn{ font-family:inherit; font-size:12.5px; font-weight:700; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; flex:0 0 auto; }
  .btn-primary{ background:var(--pink); color:#fff; }
  .btn-outline{ background:#fff; color:var(--pink-dark); border:1px solid var(--pink-dark); }
  .btn-danger{ background:var(--red); color:#fff; }
  .btn-celebrate{ background:linear-gradient(135deg, #FFD700 0%, #FF8C00 100%); color:#000; font-weight:800; border:1px solid #D4AF37; box-shadow:0 3px 8px rgba(212,175,55,0.4); }
  .btn-lock { background: #0D2C54; color: #fff; }

  .lesson-banner{ display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--pink); border-radius:12px; padding:8px 14px; margin-bottom:10px; box-shadow:0 3px 8px rgba(232,90,113,.05); }
  #lessonTimer { display:flex; align-items:center; gap:8px; min-width:250px; padding:5px 12px; border-radius:10px; border:1.5px solid #9DB9DE; background:#EAF2FB; color:#0D2C54; font-weight:800; font-size:13px; white-space:nowrap; }
  #lessonTimer .t-clock { font-family:'Reem Kufi','Tajawal',sans-serif; font-size:21px; letter-spacing:1px; direction:ltr; min-width:64px; text-align:center; }
  #lessonTimer .t-bar { flex:1; min-width:60px; height:7px; border-radius:6px; background:rgba(0,0,0,.1); overflow:hidden; }
  #lessonTimer .t-bar i { display:block; height:100%; width:0; background:#2A7B4C; transition:width .9s linear; }
  #lessonTimer.warn { background:#FFF4E5; border-color:#F0B35C; color:#8A4B00; } #lessonTimer.warn .t-bar i { background:#E08A00; }
  #lessonTimer.danger { background:#FDECEC; border-color:#E5808C; color:#B8001F; animation: livePulse 1s infinite; } #lessonTimer.danger .t-bar i { background:#B8001F; }
  #lessonTimer.idle { background:#F3F3F3; border-color:#ccc; color:#666; }
  #lessonTimer button { border:none; background:transparent; cursor:pointer; font-size:14px; padding:0 2px; }
  @media (max-width: 880px){ .lesson-banner{ flex-wrap:wrap; } #lessonTimer{ width:100%; } }
  .lesson-banner label{ font-weight:800; color:var(--pink-dark); font-size:13px; white-space:nowrap; }
  .lesson-banner input{ flex:1; font-family:inherit; font-size:14px; font-weight:700; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:#FAF3F0; color:var(--ink); }

  .star-banner{ display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, #FFF2F4, #FCE4E8); border:1px solid var(--rose); border-radius:12px; padding:8px 14px; margin-bottom:12px; flex-wrap:wrap; }
  .star-banner .star-icon{ font-size:22px; }
  .star-banner label{ font-weight:800; color:var(--pink-dark); font-size:13.5px; white-space:nowrap;}

  .table-wrap{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow-x:auto; width:100%; -webkit-overflow-scrolling:touch; margin-bottom:12px; }
  table{ width:100%; border-collapse:collapse; min-width:850px; }
  thead th{ background:var(--pink-dark); color:#fff; font-size:11.5px; font-weight:700; padding:8px 4px; text-align:center; white-space:nowrap; }
  tbody td{ padding:5px 3px; border-bottom:1px solid var(--line); font-size:12.5px; text-align:center; vertical-align:middle; }
  tbody tr:nth-child(even){ background:#FDF8F9; }
  tbody tr:hover{ background:#FADEE3; }
  
  td.name-cell{ text-align:right; font-weight:600; min-width:190px; width:190px; }
  td.name-cell input{ width:100%; border:1px solid transparent; background:transparent; font-family:inherit; font-size:14px; font-weight:600; padding:4px 5px; border-radius:5px; -webkit-appearance:none; }

  .attend-cell { display:flex; flex-direction:column; align-items:center; gap:2px; width: 62px; margin: 0 auto; }
  select.attend{ font-size:15px !important; text-align:center; text-align-last:center; }
  select.attend, select.app-status { font-family:inherit; font-size:10.5px; font-weight:700; padding:3px 2px; border-radius:5px; border:1px solid var(--line); cursor:pointer; width:100%; -webkit-appearance:none; text-align: center; }
  select.attend.present{ background:var(--present); color:var(--present-ink); }
  select.attend.absent{ background:var(--absent); color:var(--absent-ink); }
  select.attend.late{ background:var(--late); color:var(--late-ink); }
  .late-time-input { width: 100%; font-family: inherit; font-size: 10.5px; font-weight:bold; padding: 2px 4px; border-radius: 5px; border: 1.5px solid var(--gold); background: #fff; text-align: center; color:var(--late-ink); margin-top:2px; }

  .notes-box { display:flex; flex-direction:column; gap:3px; min-width:145px; }
  .notes-box select { font-family:inherit; font-size:11.5px; padding:4px; border-radius:5px; border:1px solid var(--line); background:#fff; width:100%; }
  .notes-box input { font-family:inherit; font-size:11px; padding:3px 5px; border-radius:4px; border:1px solid var(--line); width:100%; }
  
  .violations-list { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
  .violation-chip { display: flex; align-items: center; justify-content: space-between; background: #FADBD8; color: #7A1F2B; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 4px; border: 1px solid #F5C6CB; }
  .violation-chip button { border: none; background: transparent; color: var(--red); font-weight: bold; cursor: pointer; font-size: 11px; margin-right: 2px; }

  .action-box { display:flex; flex-direction:column; gap:3px; min-width:115px; }
  .btn-print-pledge { background:var(--red); color:#fff; border:none; border-radius:4px; font-size:10px; font-weight:bold; padding:3px 5px; cursor:pointer; margin-top:2px; }
  .btn-print-pledge:hover { background:#8A0017; }

  .badge-cell { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:95px; }
  .p-symbols{ min-height:16px; font-size:13px; letter-spacing:1px; }
  /* مركز التقارير */
  .rp-filter { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:#FDF2F4; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:13px; }
  .rp-filter select { padding:5px; border-radius:6px; border:1px solid var(--line); font-family:inherit; }
  .rp-hint { font-size:11.5px; color:#777; }
  .rp-group { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; background:#fff; }
  .rp-group > h4, .rp-group > summary { margin:0 0 6px; color:var(--pink-dark); font-size:15px; cursor:default; }
  .rp-tools > summary { cursor:pointer; margin:0; }
  .rp-item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-top:1px dashed #E5C7D0; }
  .rp-item:first-of-type { border-top:none; }
  .rp-item.rp-col { display:block; }
  .rp-item b { font-size:14px; display:block; }
  .rp-item small { display:block; color:#666; font-size:12px; margin-top:2px; }
  .rp-item select { margin-top:6px; padding:5px; border-radius:6px; border:1px solid var(--line); font-family:inherit; }
  .rp-check { font-size:12px; display:inline-block; margin-top:5px; }
  .rp-more { margin-top:6px; font-size:12.5px; } .rp-more summary { cursor:pointer; color:var(--pink-dark); }
  .pledge-banner{ background:#FDECEC; border:2px solid #E5808C; color:#8A0018; border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:14px; line-height:2.2; }
  .pledge-chip{ display:inline-block; background:#fff; border:1px solid #E5808C; border-radius:10px; padding:2px 10px; margin:2px 4px; }
  .record-badge{ display:inline-block; padding:6px 14px; border-radius:10px; font-size:13px; font-weight:800; margin:0 0 8px; border:1.5px solid; }
  .record-badge.saved{ background:#EAF2FB; color:#0D2C54; border-color:#9DB9DE; }
  .record-badge.fresh{ background:#FFF4E5; color:#8A4B00; border-color:#F0B35C; }
  .main-banner{ display:flex; align-items:center; gap:14px; background:linear-gradient(90deg,#fff,#FDF2F4); border:1px solid var(--line); border-radius:14px; padding:10px 16px; margin-bottom:12px; }
  .main-banner img{ width:70px; height:70px; object-fit:contain; background:#fff; border-radius:10px; flex:none; }
  .main-banner-title{ font-family:'Aref Ruqaa','Reem Kufi',serif; font-weight:700; font-size:25px; color:var(--pink-dark); line-height:1.5; }
  .main-banner-sub{ font-size:13px; color:#666; font-weight:700; }
  .bottom-bar{ position:fixed; bottom:0; left:0; right:230px; z-index:40; background:rgba(255,255,255,.97); border-top:2px solid var(--rose); box-shadow:0 -4px 14px rgba(0,0,0,.12); padding:8px 12px; }
  #mainContainer{ padding-bottom:84px !important; }
  .bottom-bar-inner{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .bottom-bar .btn{ padding:9px 16px; font-size:14px; }
  @media (max-width: 880px){ .bottom-bar{ right:0; } .bottom-bar .btn{ padding:8px 10px; font-size:12.5px; } #mainContainer{ padding-bottom:110px !important; } }
  .app-footer{ margin:18px 0 6px; padding-top:10px; border-top:2px double var(--rose); text-align:center; font-size:12.5px; color:#666; }
  .app-footer b{ color:var(--pink-dark); }
  @media (max-width: 880px){ .main-banner{ padding:8px 10px; gap:10px; } .main-banner img{ width:52px; height:52px; } .main-banner-title{ font-size:18px; } .main-banner-sub{ font-size:11px; } }
  .names-tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .names-del{ display:inline-flex; gap:6px; align-items:center; }
  .names-del select{ padding:7px; border:1px solid var(--line); border-radius:8px; font-family:inherit; max-width:220px; }
  .p-buttons{ display:flex; gap:2px; }
  .p-buttons button{ border:1px solid var(--line); background:#fff; border-radius:5px; font-size:11.5px; padding:2px 5px; cursor:pointer; }
  .p-buttons button{ font-size:15px; padding:3px 7px; }
  .p-buttons button.active{ background:#FFE9A8; border-color:#E0A800; box-shadow:0 0 0 2px #FFD25E inset; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(138,28,48,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:15px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:16px; padding:22px; max-width:850px; width:100%; border:2px solid var(--pink); max-height:92vh; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,0.2); }

  .excel-upload-box { background: #FDF2F4; border: 2px dashed var(--pink); border-radius: 10px; padding: 12px; margin-bottom: 12px; text-align: center; }
  .excel-upload-box label { display: inline-block; background: var(--pink); color: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin: 2px; }
  .excel-upload-box input[type="file"] { display: none; }

  .celebration-card { text-align:center; background:linear-gradient(180deg, #FFFFFF 0%, #FFF5F7 100%); border-radius:20px; border:3px solid var(--gold); padding:25px; width:100%; max-width:680px; position:relative; box-shadow:0 15px 40px rgba(212,175,55,0.3); }
  .celebration-title { color:var(--pink-dark); font-family:'Reem Kufi', sans-serif; font-size:22px; margin:10px 0 5px; }
  .top-winners-grid { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
  .winner-card { flex:1 1 180px; background:#fff; border-radius:14px; border:2px solid var(--pink); padding:15px 10px; box-shadow:0 5px 15px rgba(0,0,0,0.08); display:flex; flex-direction:column; align-items:center; transition:transform 0.3s; }
  .winner-card:hover { transform:translateY(-5px); }
  .winner-card.rank-1 { border-color:var(--gold); background:linear-gradient(180deg, #FFFDF0 0%, #FFFFFF 100%); transform:scale(1.05); }
  .winner-badge { font-size:32px; margin-bottom:5px; }
  .winner-name { font-weight:800; color:var(--pink-dark); font-size:14px; margin-bottom:8px; line-height:1.3; }
  .winner-stats { font-size:11px; background:#FAF3F0; border-radius:8px; padding:5px 8px; width:100%; text-align:center; border:1px solid var(--rose); font-weight:bold; }

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; padding:12px; }
    .nav-item{ display:inline-block; width:auto; margin-left:4px; margin-bottom:4px; padding:6px 9px; font-size:12px; }
    .main{ padding:10px; }
  }

  .aff-card{ background:#fff; border:3px solid var(--pink-dark); border-radius:20px; padding:18px; max-width:900px; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,.1); }
  .aff-head{ display:flex; align-items:center; gap:12px; border-bottom:2px double var(--rose); padding-bottom:10px; margin-bottom:12px; }
  .aff-head img{ width:70px; height:70px; object-fit:contain; flex:none; }
  .aff-title{ font-family:'Aref Ruqaa','Reem Kufi',serif; font-weight:700; font-size:26px; color:var(--pink-dark); line-height:1.5; }
  .aff-controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; background:#FDF2F4; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .aff-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px dashed var(--line); }
  .aff-row .aff-num{ width:28px; text-align:center; color:#888; font-weight:700; flex:none; }
  .aff-row .aff-name{ flex:1; font-weight:800; font-size:15px; min-width:0; }
  .aff-thumb{ width:48px; height:62px; border-radius:6px; object-fit:cover; border:1.5px solid var(--pink); flex:none; background:#fafafa; }
  .aff-thumb.empty{ display:flex; align-items:center; justify-content:center; font-size:10px; color:#999; border:1.5px dashed #bbb; text-align:center; }
  @media (max-width:640px){ .aff-title{ font-size:19px; } .aff-head img{ width:48px; height:48px; } .aff-row{ flex-wrap:wrap; } }
</style>

}


/* ===== ضبط صورة الطالبة: قص الحواف البيضاء تلقائياً ثم تحريك/تكبير داخل إطار البطاقة (نسبة 24:31) ===== */
function autoTrimRect(src){
  const sc = Math.min(1, 320 / Math.max(src.width, src.height));
  const w = Math.max(1, Math.round(src.width * sc)), h = Math.max(1, Math.round(src.height * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const lum = (px, py) => { const i = (py * w + px) * 4; return 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]; };
  // سطر/عمود يُعدّ «حداً» إن كان متجانساً (أبيض أو رمادي الماسحة أو خط ظل)، ويُعدّ صورة إن تنوّعت ألوانه
  const lineIsContent = (get, len) => {
    let sum = 0; for(let i = 0; i < len; i++) sum += get(i);
    const mean = sum / len; let n = 0;
    for(let i = 0; i < len; i++) if(Math.abs(get(i) - mean) > 22) n++;
    return n / len > 0.08;
  };
  const rowC = y => lineIsContent(i => lum(i, y), w);
  const colC = i => lineIsContent(y => lum(i, y), h);
  let top = 0; while(top < h - 1 && !rowC(top)) top++;
  let bottom = h - 1; while(bottom > top && !rowC(bottom)) bottom--;
  let left = 0; while(left < w - 1 && !colC(left)) left++;
  let right = w - 1; while(right > left && !colC(right)) right--;
  let rw = right - left + 1, rh = bottom - top + 1;
  if(rw < w * 0.2 || rh < h * 0.2) return { x: 0, y: 0, w: src.width, h: src.height };     // فشل الكشف: الصورة كاملة
  const ix = rw * 0.015, iy = rh * 0.01;                                                      // قص إضافي صغير للداخل لإزالة بقايا الحافة
  left += ix; top += iy; rw -= 2 * ix; rh -= 2 * iy;
  return { x: left / sc, y: top / sc, w: rw / sc, h: rh / sc };
}
function openPhotoCropper(src, rect, cb, onReplace){
  const FW = 240, FH = 310;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:12px; direction:rtl; font-family:inherit;';
  ov.innerHTML = `<div style="background:#fff; border-radius:16px; padding:16px; max-width:340px; width:100%; text-align:center; max-height:96vh; overflow:auto;">
    <div style="font-weight:800; color:#8A1C30; font-size:17px;">✂️ ضبط الصورة داخل إطار البطاقة</div>
    <div style="font-size:12px; color:#666; margin:4px 0 8px; line-height:1.7;">اسحبي الصورة لتحريكها، وكبّري بالمنزلق حتى لا يظهر أي حد أبيض حول الصورة.</div>
    <canvas id="pcCanvas" width="${FW}" height="${FH}" style="width:${FW}px; height:${FH}px; border:2px solid #E85A71; border-radius:6px; touch-action:none; cursor:grab; background:#fff;"></canvas>
    <div style="margin:8px 0;"><input type="range" id="pcZoom" min="0" max="100" value="0" style="width:90%;"></div>
    <div style="display:flex; gap:8px; justify-content:center;"><button class="btn btn-primary" id="pcOk">✔ اعتماد الصورة</button>${onReplace ? '<button class="btn btn-outline" id="pcReplace">🔄 صورة أخرى</button>' : ''}<button class="btn btn-outline" id="pcCancel">إلغاء</button></div></div>`;
  document.body.appendChild(ov);
  const cv = ov.querySelector('#pcCanvas'), ctx = cv.getContext('2d'), zoom = ov.querySelector('#pcZoom');
  const sMin = Math.max(FW / src.width, FH / src.height);
  let s0 = Math.max(FW / rect.w, FH / rect.h, sMin);
  const sMax = Math.max(s0 * 4, sMin * 6);
  let s = s0, ox = FW / 2 - (rect.x + rect.w / 2) * s, oy = FH / 2 - (rect.y + rect.h / 2) * s;
  const clamp = () => { ox = Math.min(0, Math.max(FW - src.width * s, ox)); oy = Math.min(0, Math.max(FH - src.height * s, oy)); };
  const draw = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, FW, FH); ctx.drawImage(src, ox, oy, src.width * s, src.height * s); };
  zoom.value = Math.round(100 * Math.log(s / sMin) / Math.log(sMax / sMin));
  clamp(); draw();
  zoom.oninput = () => {
    const cx = (FW / 2 - ox) / s, cy = (FH / 2 - oy) / s;
    s = sMin * Math.pow(sMax / sMin, zoom.value / 100);
    ox = FW / 2 - cx * s; oy = FH / 2 - cy * s; clamp(); draw();
  };
  let drag = null;
  cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; };
  cv.onpointermove = e => { if(!drag) return; ox += e.clientX - drag.x; oy += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; clamp(); draw(); };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; cv.style.cursor = 'grab'; };
  ov.querySelector('#pcCancel').onclick = () => ov.remove();
  const rb = ov.querySelector('#pcReplace'); if(rb) rb.onclick = () => { ov.remove(); onReplace(); };
  ov.querySelector('#pcOk').onclick = () => {
    const k = 480 / FW, out = document.createElement('canvas'); out.width = 480; out.height = Math.round(FH * k);
    const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(src, ox * k, oy * k, src.width * s * k, src.height * s * k);
    const url = out.toDataURL('image/jpeg', 0.92);
    ov.remove(); cb(url, src);
  };
}
function loadSrcCanvas(dataUrl){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c);
    };
    img.onerror = rej; img.src = dataUrl;
  });
}
// قص تلقائي مباشر (بلا نافذة): يملأ إطار 24×31 بعد إزالة الحواف، مع قص إضافي بنسبة extra من كل جانب
function coverCropToFrame(src, rect, extra){
  const FW = 240, FH = 310, e = extra || 0;
  const r = { x: rect.x + rect.w * e, y: rect.y + rect.h * e, w: rect.w * (1 - 2 * e), h: rect.h * (1 - 2 * e) };
  const sMin = Math.max(FW / src.width, FH / src.height);
  const s = Math.max(FW / r.w, FH / r.h, sMin);
  let ox = FW / 2 - (r.x + r.w / 2) * s, oy = FH / 2 - (r.y + r.h / 2) * s;
  ox = Math.min(0, Math.max(FW - src.width * s, ox)); oy = Math.min(0, Math.max(FH - src.height * s, oy));
  const k = 480 / FW, out = document.createElement('canvas'); out.width = 480; out.height = Math.round(FH * k);
  const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(src, ox * k, oy * k, src.width * s * k, src.height * s * k);
  return out.toDataURL('image/jpeg', 0.92);
}
function compressImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
      const src = document.createElement('canvas'); src.width = Math.round(img.width * sc); src.height = Math.round(img.height * sc);
      src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
      openPhotoCropper(src, autoTrimRect(src), cb);
    };
    img.onerror = () => alert('تعذّر قراءة الصورة، جرّبي صورة أخرى.');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  const minLogoData = localStorage.getItem('custom_ministry_logo_v2');
  const schLogoData = localStorage.getItem('custom_school_logo_v2');

  const minLogoHTML = `<img src="${minLogoData || getMinistryLogo()}" style="width:16.5mm; height:16.5mm; margin:-2mm 0 -0.5mm; object-fit:contain;">`;
  const schLogoHTML = schLogoData ? `<img src="${schLogoData}" style="width:14mm; height:14mm; object-fit:contain;">` : `<img src="${getSchoolLogo()}" style="width:14mm; height:14mm; object-fit:contain;">`;

  const isGrade12 = currentGradeId === 'g12s' || currentGradeId === 'g12l';

  let cardsHTML = '';
  secData.students.forEach((name, idx)=>{
    if(secData.hiddenCards && secData.hiddenCards.includes(name)) return;
    const photo = secData.photos[idx];
    if(onlyPhoto === true && !photo) return;
    if(Array.isArray(selected) && !selected.includes(idx)) return;
    const shortName = formatThreePartName(name);

    const nameParts = name.trim().split(/\s+/);
    const fourName = nameParts.length > 4 ? [nameParts[0], nameParts[1], nameParts[2], nameParts[nameParts.length - 1]].join(' ') : nameParts.join(' ');
    // الألوان حسب الصف
    const T = isGrade12
      ? { box:'border:2.5px solid #E85A71; background:linear-gradient(135deg, #0A1826 0%, #1E3A52 100%); color:#fff;', line:'#E85A71', title:'#E85A71', sub:'#2B2B2B', subBox:'background:#fff; border-radius:1.5mm; padding:0 2mm;', lbl:'#E85A71', val:'#000000', panel:'', valBox:'background:#fff; border-radius:1.5mm; padding:0.5mm 2mm;', foot:'#E85A71', phBorder:'1.5px solid #E85A71', phEmpty:'border:1.5px dashed #E85A71; color:#E85A71; background:rgba(232,90,113,0.05);', phText:'صورة<br>الخريجة', deco:'<div style="position:absolute; right:-10mm; bottom:-10mm; font-size:90pt; opacity:0.1; color:#E85A71; pointer-events:none;">🎓</div>', footTxt:'🌸 🎓 خريجة 2026-2027 🎓 🌸' }
      : { box:'border:2px solid #0D2C54; background:#fff;', line:'#0D2C54', title:'#0D2C54', sub:'#2B2B2B', subBox:'', lbl:'#0D2C54', val:'#111111', panel:'', valBox:'', foot:'#0D2C54', phBorder:'none', phEmpty:'border:1.5px dashed #0D2C54; color:#0D2C54;', phText:'الصورة<br>الشخصية', deco:'', footTxt:'العام الدراسي 2026/2027' };

    cardsHTML += `
      <div style="width:90mm; height:60mm; ${T.box} border-radius:4mm; padding:3mm; display:flex; flex-direction:column; justify-content:space-between; page-break-inside:avoid; box-sizing:border-box; position:relative; overflow:hidden;">
        ${T.deco}
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid ${T.line}; padding-bottom:2px; z-index:1;">
          ${minLogoHTML}
          <div style="text-align:center;">
            <h4 style="margin:0; line-height:1.1; font-family:'Reem Kufi', sans-serif; font-size:15pt; color:${T.title}; font-weight:800;">بطاقة طالبة</h4>
            <div style="margin:1.5px 0 0; display:inline-block; line-height:1.2; font-size:8pt; font-weight:800; color:${T.sub}; ${T.subBox}"><div>منطقة الأحمدي التعليمية</div><div>ثانوية موضي سلطان العيسى - بنات</div></div>
          </div>
          ${schLogoHTML}
        </div>
        <div style="display:flex; justify-content:space-between; align-items:stretch; flex:1; gap:3mm; padding-top:2mm; z-index:1;">
          <div style="text-align:right; display:flex; flex-direction:column; justify-content:space-between; flex:1; min-width:0;">
            <div>
              <div style="${T.panel}">
                <p style="margin:0; text-align:center; font-size:11.5pt; font-weight:800; color:${T.lbl};">الاسم:</p>
                <p class="fitname" style="margin:1px 0 0; text-align:center; white-space:nowrap; font-size:14pt; font-weight:800; color:${T.val};"><span style="${T.valBox}">${fourName}</span></p>
                <p style="margin:5mm 0 0; text-align:center; font-size:13.5pt; font-weight:800; color:${T.lbl};">الصف: <span style="color:${T.val}; ${T.valBox}">${currentSection}</span></p>
              </div>
            </div>
          </div>
          ${photo ? `<img src="${photo}" style="width:24mm; height:31mm; border-radius:2mm; object-fit:cover; ${T.phBorder === 'none' ? '' : 'border:' + T.phBorder + ';'}">` : `<div style="width:24mm; height:31mm; ${T.phEmpty} border-radius:2mm; font-size:8pt; text-align:center; display:flex; align-items:center; justify-content:center;">${T.phText}</div>`}
        </div>
        <div style="text-align:center; border-top:1px dashed ${T.line}; padding-top:2px; font-size:9pt; color:${T.foot}; font-weight:800; z-index:1;">${T.footTxt}</div>
      </div>
    `;
  });

  const printWindow = window.open('', '_blank');
  printWindow.document.write(`
    <!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
      <meta charset="UTF-8">
      <title>طباعة البطاقات</title>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Reem+Kufi:wght@700;800&display=swap" rel="stylesheet">
      <style>@page{size:A4 portrait; margin:5mm;} body{font-family:'Tajawal', sans-serif;} .cards-grid{display:grid; grid-template-columns:90mm 90mm; gap:6mm; justify-content:center;}</style>
    </head>
    <body dir="rtl">
      <div class="cards-grid">${cardsHTML}</div>
      <script>
        function fitNames(){ document.querySelectorAll('.fitname').forEach(function(p){ var sp = p.firstElementChild, fs = 14; p.style.fontSize = fs + 'pt'; while(sp.offsetWidth > p.clientWidth && fs > 6){ fs -= 0.25; p.style.fontSize = fs + 'pt'; } }); }
        window.onload=function(){ var go=function(){ fitNames(); setTimeout(function(){window.print();}, 300); }; if(document.fonts && document.fonts.ready){ document.fonts.ready.then(go); } else { go(); } };
      <\/script>
    </body>
    </html>
  `);
  printWindow.document.close();
}



/* ================= صفحة شؤون الطلبة المستقلة (بلا تسجيل دخول) ================= */
let currentGradeId = GRADES[0].id, currentSection = SECTIONS[GRADES[0].id][0];
let currentUserDisplayName = 'شؤون الطلبة', currentDepartmentName = 'شؤون الطلبة';
let live = { refs: [], students: null, photos: null, hidden: [], sel: null, bk: {} };
let pending = 0;

function secName(){ return `section_${currentGradeId}_${currentSection}`; }
function bkRef(name, idx){ return db.ref(DB_PREFIX + 'photo_backup/' + name + '/' + idx); }
// كل تعديل على صورة يحفظ نسخة سابقة (prev) والأصلية (orig) في فرع منفصل لا تحمّله صفحات المعلمات
async function backedUpSet(name, idx, curVal, newVal, isNewUpload){
  if(curVal){
    const bk = bkRef(name, idx), b = (await bk.once('value')).val() || {};
    const upd = { prev: curVal };
    if(!b.orig || isNewUpload) upd.orig = isNewUpload ? newVal : curVal;
    await bk.update(upd);
    await db.ref(DB_PREFIX + 'photo_backup_flag/' + name + '/' + idx).set(true);
  }
  const pr = db.ref(DB_PREFIX + name + '/photos/' + idx);
  if(newVal === null) await pr.remove(); else await pr.set(newVal);
}
function secPath(){ return DB_PREFIX + `section_${currentGradeId}_${currentSection}`; }
function getSectionData(){ return { students: live.students || [], photos: live.photos || {}, hiddenCards: live.hidden || [] }; }
function setStatus(txt, col){ const e = document.getElementById('affSaveStatus'); e.textContent = txt; e.style.color = col || '#FFD37A'; }

function watchSection(){
  live.refs.forEach(r => r.off());
  live = { refs: [], students: null, photos: null, hidden: [], sel: null, bk: {} };
  const base = db.ref(secPath());
  const sub = (name, fn) => { const r = base.child(name); r.on('value', snap => { fn(snap.val()); renderAffairs(); }, () => setStatus('⚠️ تعذّر الاتصال بالسحابة', '#FFB3B3')); live.refs.push(r); };
  sub('students', v => { live.students = toArr(v); live.studentsLoaded = true; });
  sub('photos', v => { live.photos = (v && typeof v === 'object') ? v : {}; live.photosLoaded = true; });
  sub('hiddenCards', v => { live.hidden = toArr(v); });
  const fr = db.ref(DB_PREFIX + 'photo_backup_flag/' + secName());
  fr.on('value', snap => { live.bk = snap.val() || {}; renderAffairs(); });
  live.refs.push(fr);
  renderAffairs();
}

function renderAffNav(){
  const nav = document.getElementById('affNavList'); nav.innerHTML = '';
  GRADES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (g.id === currentGradeId ? ' active' : '');
    btn.textContent = g.name;
    btn.onclick = () => { currentGradeId = g.id; currentSection = SECTIONS[g.id][0]; fillSections(); renderAffNav(); watchSection(); };
    nav.appendChild(btn);
  });
}
function fillSections(){
  const sSel = document.getElementById('affSection');
  sSel.innerHTML = SECTIONS[currentGradeId].map(x => `<option value="${x}">${x}</option>`).join('');
  sSel.value = currentSection;
}

function renderAffairs(){
  const list = document.getElementById('affairsList'), sum = document.getElementById('affSummary');
  const grade = GRADES.find(g => g.id === currentGradeId);
  document.getElementById('affGradeTitle').textContent = grade.name + ' — شعبة ' + currentSection;
  if(live.students === null || live.photos === null){
    list.innerHTML = '<tr><td colspan="5" style="padding:18px; color:#777;">⏳ جارٍ تحميل أسماء الطالبات من السحابة... تأكدي من الاتصال بالإنترنت.</td></tr>'; sum.textContent = ''; return;
  }
  if(live.students.length === 0){
    list.innerHTML = '<tr><td colspan="5" style="padding:18px; color:#777;">لم تُسجَّل أسماء طالبات هذه الشعبة بعد. تُدخلها المعلمة من «إدارة أسماء الطالبات».</td></tr>'; sum.textContent = ''; return;
  }
  if(!live.sel) live.sel = new Set(visibleIdxs());
  let n = 0, withPhoto = 0, html = '';
  live.students.forEach((name, idx) => {
    if(live.hidden.includes(name)) return;
    n++;
    const ph = live.photos[idx]; if(ph) withPhoto++;
    html += `<tr>
      <td><input type="checkbox" style="width:18px; height:18px;" ${live.sel.has(idx) ? 'checked' : ''} onchange="affToggle(${idx}, this.checked)"></td>
      <td>${n}</td>
      <td class="name-cell" style="font-size:14px; font-weight:700;">${escHtml(name)}</td>
      <td>${ph ? `<img class="aff-thumb" src="${ph}" alt="" style="margin:0 auto; display:block;">` : '<div class="aff-thumb empty" style="margin:0 auto;">بلا صورة</div>'}</td>
      <td>
        <input type="file" accept="image/*" id="affFile_${idx}" style="display:none;" onchange="affUploadPhoto(event, ${idx})">
        ${ph ? '' : `<button class="btn btn-outline" onclick="document.getElementById('affFile_${idx}').click()">📁 رفع صورة</button>`}
        ${ph ? `<button class="btn btn-outline" onclick="affRecrop(${idx})">✂️ تعديل</button>` : ''}
        ${live.bk && live.bk[idx] ? `<button class="btn btn-outline" style="color:#0D2C54; border-color:#0D2C54;" onclick="affUndo(${idx})">${ph ? '↩️ تراجع' : '↩️ استرجاع'}</button>` : ''}
        ${ph ? `<button class="btn btn-outline" style="color:var(--red); border-color:var(--red);" onclick="affRemovePhoto(${idx})">🗑️</button>` : ''}
      </td></tr>`;
  });
  list.innerHTML = html;
  updateSelUI();
  sum.textContent = `عدد الطالبات: ${n} — لديهن صور: ${withPhoto} — بلا صور: ${n - withPhoto}`;
}


/* ===== اختيار الطالبات اللواتي تُطبع بطاقاتهن ===== */
function visibleIdxs(){ const st = live.students || []; return st.map((n, i) => i).filter(i => !live.hidden.includes(st[i])); }
function updateSelUI(){
  const v = visibleIdxs(), n = v.filter(i => live.sel && live.sel.has(i)).length;
  const c = document.getElementById('affPrintCount'); if(c) c.textContent = n;
  const m = document.getElementById('affSelAll'); if(m) m.checked = v.length > 0 && n === v.length;
}
function affToggle(i, on){ if(on) live.sel.add(i); else live.sel.delete(i); updateSelUI(); }
function affToggleAll(on){ live.sel = new Set(on ? visibleIdxs() : []); renderAffairs(); }
function affSelectWithPhotos(){ live.sel = new Set(visibleIdxs().filter(i => live.photos && live.photos[i])); renderAffairs(); }
function affPrintSelected(){
  const idxs = visibleIdxs().filter(i => live.sel && live.sel.has(i));
  if(!idxs.length){ alert('حددي طالبة واحدة على الأقل لطباعة بطاقتها.'); return; }
  printAllCards(false, idxs);
}


/* ===== إصلاح صور موجودة سابقاً ===== */
async function affRecrop(idx){
  const url = live.photos && live.photos[idx]; if(!url) return;
  const name = secName();
  let srcUrl = url;
  try{ const v = (await db.ref(DB_PREFIX + 'photo_src/' + name + '/' + idx).once('value')).val(); if(v) srcUrl = v; }catch(e){}
  loadSrcCanvas(srcUrl).then(src => openPhotoCropper(src, shrinkRect(autoTrimRect(src), srcUrl === url ? 0.04 : 0.02),
      out => trackWrite(backedUpSet(name, idx, url, out)),
      () => { const fi = document.getElementById('affFile_' + idx); if(fi) fi.click(); }))
    .catch(() => alert('تعذّر فتح الصورة.'));
}
function shrinkRect(r, e){ return { x: r.x + r.w * e, y: r.y + r.h * e, w: r.w * (1 - 2 * e), h: r.h * (1 - 2 * e) }; }
/* ===== التراجع ===== */
async function swapBackup(name, idx, key){
  const bk = bkRef(name, idx), b = (await bk.once('value')).val() || {};
  const target = b[key]; if(!target) return false;
  const pr = db.ref(DB_PREFIX + name + '/photos/' + idx);
  const cur = (await pr.once('value')).val();
  await pr.set(target);
  await bk.update({ prev: cur || null });          // يبقى بالإمكان الرجوع للنسخة التي كانت قبل التراجع
  return true;
}
function affUndo(idx){
  const name = secName();
  trackWrite(swapBackup(name, idx, 'prev').then(ok => { if(!ok) alert('لا توجد نسخة سابقة لهذه الصورة.'); }));
}
async function affUndoAll(toOriginal){
  const name = secName();
  const idxs = visibleIdxs().filter(i => live.bk && live.bk[i]);
  if(!idxs.length){ alert('لا توجد تعديلات يمكن التراجع عنها في هذه الشعبة.'); return; }
  const msg = toOriginal ? `سيتم استرجاع الصور الأصلية (كما رُفعت) لـ ${idxs.length} طالبة في هذه الشعبة.` : `سيتم التراجع عن آخر تعديل (زوم أو قص أو تغيير أو حذف) لـ ${idxs.length} طالبة في هذه الشعبة.`;
  if(!confirm(msg + '\n\nهل تريدين المتابعة؟')) return;
  let done = 0;
  for(const i of idxs){
    try{ if(await swapBackup(name, i, toOriginal ? 'orig' : 'prev')){ done++; setStatus(`⏳ تم التراجع لـ ${done} من ${idxs.length}...`); } }catch(e){}
  }
  setStatus(`✅ تم التراجع لـ ${done} من ${idxs.length} صورة`, '#BFF0CF');
}

function trackWrite(promise){
  pending++; setStatus('⏳ جارٍ الحفظ في السحابة...', '#FFD37A');
  promise.then(() => { pending--; if(!pending) setStatus('✅ تم الحفظ في السحابة — ' + new Date().toLocaleTimeString('ar-KW', { hour: '2-digit', minute: '2-digit' }), '#BFF0CF'); })
         .catch(() => { pending--; setStatus('⚠️ تعذّر الحفظ، أعيدي المحاولة', '#FFB3B3'); });
}
function affUploadPhoto(e, idx){
  const file = e.target.files[0]; if(!file) return;
  e.target.value = ''; compressImageFile(file, (dataUrl, srcCanvas) => {
    const name = secName(), cur = (live.photos || {})[idx];
    const srcUrl = srcCanvas.toDataURL('image/jpeg', 0.88);
    trackWrite(Promise.all([ backedUpSet(name, idx, cur, dataUrl, true), db.ref(DB_PREFIX + 'photo_src/' + name + '/' + idx).set(srcUrl) ]));
  });
}
function affRemovePhoto(idx){
  const name = (live.students || [])[idx];
  if(!confirm(`حذف صورة «${name}»؟`)) return;
  trackWrite(backedUpSet(secName(), idx, (live.photos || {})[idx], null));
}

window.addEventListener('beforeunload', e => { if(pending > 0){ e.preventDefault(); e.returnValue = ''; } });
['affLogoImg','affMainLogoImg'].forEach(id => { document.getElementById(id).src = getSchoolLogo(); });
document.getElementById('affSection').onchange = e => { currentSection = e.target.value; watchSection(); };
fillSections(); renderAffNav(); watchSection(); setStatus('جاهزة', '#FFD37A');
</script>
</body>
